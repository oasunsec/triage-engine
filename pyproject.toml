[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corrobora"
version = "3.0.0"
description = "Windows endpoint investigation platform for EVTX triage, detection, correlation, analyst review, and HTML case reporting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-evtx>=0.7.4",
]

[project.optional-dependencies]
live = ["pywin32>=306"]
sigma = ["PyYAML>=6.0"]
server = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.7"]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[project.scripts]
corrobora = "corrobora.cli:main"
triage = "corrobora.cli:main"  # old command name, kept for existing scripts

[tool.setuptools]
packages = ["corrobora", "models", "parser", "detectors", "correlation", "reporting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".tmp", "runtime", "cases", "data", "uploads", "output", "repo_cache", "audit-cases", "audit-artifacts", "artifacts", "triage-api-test-*", "node_modules"]

name: quality-gates

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  forensic-foundation:
    name: Forensic Foundation Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    env:
      TRIAGE_DATA_DIR: ${{ github.workspace }}/runtime/test-output/forensic-gate-state
      TRIAGE_CASES_DIR: ${{ github.workspace }}/runtime/test-output/forensic-gate-cases
      TRIAGE_UPLOAD_DIR: ${{ github.workspace }}/runtime/test-output/forensic-gate-uploads
      TRIAGE_ENV_FILE: ${{ github.workspace }}/runtime/test-output/forensic-gate-state/empty.env
      TEMP: ${{ github.workspace }}/runtime/temp/forensic-gate
      TMP: ${{ github.workspace }}/runtime/temp/forensic-gate
      TMPDIR: ${{ github.workspace }}/runtime/temp/forensic-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Prepare contained runtime
        run: python -c "import os; [os.makedirs(os.environ[name], exist_ok=True) for name in ('TRIAGE_DATA_DIR', 'TRIAGE_CASES_DIR', 'TRIAGE_UPLOAD_DIR', 'TEMP')]"

      - name: Install dependencies
        run: python -m pip install -e ".[server,sigma,test]"

      - name: Verify evidence, artifact intake, backups, and detection semantics
        run: >-
          python -m pytest -q --tb=short
          tests/test_forensic_foundation.py tests/test_evidence_export_bundle.py
          tests/test_evidence_source_adapters.py tests/test_backup_integrity.py
          tests/test_sigma_semantics.py tests/test_artifact_collector_asset.py
          tests/test_browser_artifacts.py tests/test_prefetch_artifacts.py
          tests/test_prefetch_binary.py
          tests/test_artifact_packager.py tests/test_artifact_expansion.py
          tests/test_forensic_correlation.py tests/test_forensic_api.py
          tests/test_task_xml_artifacts.py tests/test_registry_hive_artifacts.py tests/test_ntfs_artifacts.py
          tests/test_workstation_benign.py tests/test_executable_inventory.py tests/test_workspace_delivery.py
          tests/test_parser_availability.py tests/test_parser_parallel.py
          tests/test_product_workflow.py tests/test_html_report.py
          --basetemp=runtime/test-output/forensic-gate
          --junitxml=runtime/test-output/forensic-gate.xml

      - name: Preserve verification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forensic-gate-${{ matrix.os }}-${{ matrix.python }}
          path: runtime/test-output/forensic-gate.xml
          if-no-files-found: warn

  api-regression:
    name: API Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,sigma,test]"

      - name: Run API test suite
        run: python -m unittest tests.test_api

  performance-regression:
    name: Performance Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,sigma,test]"

      - name: Run performance test suite
        run: python -m unittest tests.test_performance

  benchmark-wave2:
    name: Competitive Benchmark Gate (Wave 2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,sigma,test]"

      - name: Prepare Wave 2 benchmark inputs
        run: python scripts/prepare_benchmark_inputs.py --manifest config/benchmark/corpus.json

      - name: Run competitive evaluation
        run: python scripts/competitive_eval.py --manifest config/benchmark/corpus.json --report competitive_eval.json --skip-hayabusa --fail-on-expectation

      - name: Upload competitive report
        uses: actions/upload-artifact@v4
        with:
          name: competitive-eval-report
          path: competitive_eval.json
          if-no-files-found: error

  readiness-gate:
    name: Production Readiness Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,sigma,test]"

      - name: Prepare Wave 2 benchmark inputs
        run: python scripts/prepare_benchmark_inputs.py --manifest config/benchmark/corpus.json

      - name: Run production readiness check
        run: python scripts/production_readiness.py

      - name: Upload production readiness report
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-report
          path: audit-artifacts/production_readiness.json
          if-no-files-found: error

  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    needs:
      - forensic-foundation
      - api-regression
      - performance-regression
      - benchmark-wave2
      - readiness-gate
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,sigma,test]"

      - name: Download competitive report
        uses: actions/download-artifact@v4
        with:
          name: competitive-eval-report
          path: .

      - name: Download readiness report
        uses: actions/download-artifact@v4
        with:
          name: production-readiness-report
          path: .

      - name: Run release gate
        run: python scripts/release_gate.py --config config/release_gate.ci.json --strict --report release_gate.json

      - name: Upload release gate report
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-report
          path: release_gate.json
          if-no-files-found: error

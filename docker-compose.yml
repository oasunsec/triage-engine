services:
  corrobora:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corrobora
    user: "${CORROBORA_CONTAINER_UID:-10001}:${CORROBORA_CONTAINER_GID:-10001}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./cases:/app/cases
    environment:
      CORROBORA_RUNTIME_MODE: "docker"
      CORROBORA_HOST: "0.0.0.0"
      CORROBORA_PORT: "8000"
      CORROBORA_DATA_DIR: "/app/data"
      CORROBORA_CASES_DIR: "/app/cases"
      CORROBORA_UPLOAD_DIR: "/app/data/uploads"
      CORROBORA_MAX_UPLOAD_MB: "500"
      CORROBORA_CORS_ORIGINS: "localhost"
      CORROBORA_INVESTIGATION_TIMEOUT_SECONDS: "1800"
      CORROBORA_DETECTOR_TIMEOUT_SECONDS: "30"
      CORROBORA_QUEUE_SYNC_INTERVAL_SECONDS: "30"
      CORROBORA_SESSION_TTL_HOURS: "12"
      CORROBORA_SESSION_IDLE_HOURS: "2"
      CORROBORA_PARSE_EXECUTOR: "serial"
      CORROBORA_PARSE_WORKERS: "4"
      CORROBORA_LOG_FILE_ENABLED: "1"
      CORROBORA_LOG_FILE_PATH: "/app/data/corrobora.log"
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
